<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netflix Landing Page - Ultimate</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:#000;color:white;font-family:'Poppins',sans-serif}

/* Loader */
#loader{
  position:fixed;width:100%;height:100%;background:black;color:red;
  display:flex;justify-content:center;align-items:center;
  font-size:40px;z-index:999;
}

nav{display:flex;justify-content:space-between;align-items:center;padding:20px 60px}
.logo{color:red;font-size:30px;font-weight:700}
.btn{background:red;color:white;padding:10px 18px;border:none;border-radius:4px;cursor:pointer;transition:0.3s}
.btn:hover{background:#e50914;box-shadow:0 0 10px red}

.hero{
  height:95vh;position:relative;
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
  padding:20px
}
.bg-video{
  position:absolute;width:100%;height:100%;object-fit:cover;z-index:-1;
}
.hero h1{font-size:55px;max-width:800px}
.hero p{font-size:22px;margin:20px 0}
.hero input{padding:14px;width:320px;border:none;border-radius:4px}
.hero button{padding:14px 25px;background:red;color:white;border:none;border-radius:4px;margin-top:10px;cursor:pointer}

.section{
  display:flex;align-items:center;justify-content:space-between;
  padding:80px 60px;gap:40px;border-top:6px solid #222;opacity:0;transform:translateY(40px);transition:0.6s
}
.section.show{opacity:1;transform:translateY(0)}
.section img{width:450px;border-radius:10px}

.faq{padding:80px;text-align:center}
.faq-item{background:#222;margin:12px auto;padding:18px;max-width:750px;cursor:pointer;text-align:left}
.faq-content{display:none;padding-top:10px;color:#bbb}

footer{padding:40px;text-align:center;color:#777;border-top:1px solid #222}

.modal{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.9);display:none;justify-content:center;align-items:center;
}
.modal-content{
  background:#111;padding:30px;border-radius:10px;width:300px;text-align:center;
}
.modal input{width:90%;padding:10px;margin:10px 0;background:#222;color:white;border:none}

@media(max-width:768px){
  .hero h1{font-size:32px}
  .section{flex-direction:column;text-align:center;padding:50px 20px}
  .section img{width:100%}
}
</style>
</head>
<body>

<!-- Loader -->
<div id="loader">NETFLIX</div>

<nav>
<div class="logo">NETFLIX</div>
<button class="btn" onclick="openModal()">Sign In</button>
</nav>

<div class="hero">
<video autoplay muted loop class="bg-video">
  <source src="https://www.w3schools.com/howto/rain.mp4" type="video/mp4">
</video>
<h1>Unlimited movies, TV shows and more</h1>
<p>Watch anywhere. Cancel anytime.</p>
<input type="email" placeholder="Email address">
<button>Get Started</button>
</div>

<div class="section">
<div>
<h2>Enjoy on your TV</h2>
<p>Watch on smart TVs, PlayStation and more.</p>
</div>
<img src="https://assets.nflxext.com/ffe/siteui/acquisition/ourStory/fuji/desktop/tv.png">
</div>

<div class="section">
<img src="https://assets.nflxext.com/ffe/siteui/acquisition/ourStory/fuji/desktop/mobile-0819.jpg">
<div>
<h2>Download your shows</h2>
<p>Save your favourites and watch offline.</p>
</div>
</div>

<div class="faq">
<h2>FAQ</h2>
<div class="faq-item" onclick="toggleFAQ(this)">What is Netflix?
<div class="faq-content">Streaming service.</div></div>
</div>

<footer>
<p>© 2026 Netflix Clone by Dhanush</p>
</footer>

<div class="modal" id="modal">
<div class="modal-content">
<h2>Sign In</h2>
<input type="text" placeholder="Email">
<input type="password" placeholder="Password">
<button class="btn">Login</button>
<button onclick="closeModal()">Close</button>
</div>
</div>

<script>
// loader
window.onload = () => {
  setTimeout(()=>{
    document.getElementById("loader").style.display = "none";
  },1500);
}

function toggleFAQ(el){
const content=el.querySelector('.faq-content');
content.style.display=content.style.display==='block'?'none':'block';
}
function openModal(){document.getElementById('modal').style.display='flex'}
function closeModal(){document.getElementById('modal').style.display='none'}

// scroll animation
const sections=document.querySelectorAll('.section');
window.addEventListener('scroll',()=>{
sections.forEach(sec=>{
if(window.scrollY > sec.offsetTop-400){sec.classList.add('show')}
})
});
</script>

</body>
</html>
